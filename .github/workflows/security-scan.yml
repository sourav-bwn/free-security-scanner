name: Security scan
# Runs on this repo itself and can be called from any other repo (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      header_url:
        description: 'Optional live URL to check security headers / HTTPS (leave empty to skip)'
        required: false
        default: ''
  workflow_call:
    inputs:
      header_url:
        description: 'Optional live URL to check security headers / HTTPS'
        type: string
        required: false
        default: ''
      allowed_owner:
        description: 'Only open issues in repos owned by this user'
        type: string
        required: false
        default: 'sourav-bwn'

permissions:
  contents: read
  issues: write

concurrency:
  group: security-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout scanner scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sourav-bwn/free-security-scanner
          ref: main
          path: .scanner-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Semgrep CE
        run: python -m pip install 'semgrep==1.178.0'
      - name: Semgrep (OWASP, secrets, JS/TS, Python, Docker rule packs)
        run: |
          semgrep scan \
            --config p/security-audit --config p/secrets --config p/owasp-top-ten \
            --config p/javascript --config p/typescript --config p/nodejs \
            --config p/expressjs --config p/react --config p/python \
            --config p/jwt --config p/dockerfile \
            --exclude .scanner-tools --exclude node_modules \
            --json --output semgrep.json --metrics off .
      - name: Dependency audit (npm / pip)
        run: python .scanner-tools/scripts/dependency_audit.py dependencies.json
      - name: Project hygiene checks (.gitignore, .env, committed keys, helmet, rate limit)
        run: python .scanner-tools/scripts/hygiene_checks.py hygiene.json
      - name: Live header / HTTPS check
        if: ${{ inputs.header_url != '' }}
        env:
          HEADER_URL: ${{ inputs.header_url }}
        run: python .scanner-tools/scripts/header_check.py "$HEADER_URL" headers.json
      - name: Open issues for new findings
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ALLOWED_OWNER: ${{ inputs.allowed_owner || 'sourav-bwn' }}
        run: python .scanner-tools/scripts/security_issues.py semgrep.json dependencies.json hygiene.json headers.json
